name: Build & Release

# Versions come from git tags — see .github/scripts/compute-version.sh.
#
#   Pull request to main  → build the VSIX, upload as a workflow artifact (no release)
#   Push to main          → GitHub *pre-release* vX.(Y+1).0-pre.<run>, never marked "latest"
#   Run workflow (manual) → full release (default: next minor), marked "latest"
#   Push a vX.Y.Z tag     → full release of that tag (same as the manual run)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump from the latest release (ignored if "version" is set)'
        type: choice
        options: [minor, patch, major]
        default: minor
      version:
        description: 'Exact version to release, e.g. 1.4.0 (optional)'
        type: string
        required: false

permissions:
  contents: write   # create tags/releases, commit the released version back to main

# Releases from main run one at a time so tags/versions can't race; PR builds cancel superseded runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KEEP_PRERELEASES: 10   # older automatic pre-releases (and their tags) are deleted

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Only release from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from the main branch (selected: ${GITHUB_REF_NAME})"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags are needed to work out the version

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute version
        id: version
        env:
          PR_NUMBER: ${{ github.event.number }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: bash .github/scripts/compute-version.sh

      - name: Stamp version into package.json
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Syntax check
        run: node --check extension.js

      - name: Package VSIX
        run: |
          FLAGS=""
          [ "${{ steps.version.outputs.kind }}" = "release" ] || FLAGS="--pre-release"
          npx vsce package $FLAGS --out "pnnl-claude-switch-${{ steps.version.outputs.version }}.vsix"

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pnnl-claude-switch-${{ steps.version.outputs.version }}
          path: pnnl-claude-switch-${{ steps.version.outputs.version }}.vsix

      - name: Write release notes
        if: steps.version.outputs.kind != 'build'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ "${{ steps.version.outputs.kind }}" = "prerelease" ]; then
            {
              echo "Automatic pre-release built from \`main\` at ${GITHUB_SHA::7}."
              echo "Not the latest release — for testing. Install with \`code --install-extension pnnl-claude-switch-$VERSION.vsix --force\`."
              echo
            } > release-notes.md
          else
            # The matching CHANGELOG section, if there is one
            awk -v v="$VERSION" '
              index($0, "## [" v "]") == 1 { found = 1; next }
              found && index($0, "## [") == 1 { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
            [ -s release-notes.md ] || echo "::warning::CHANGELOG.md has no section for [$VERSION] — using generated notes only"
          fi
          cat release-notes.md

      - name: Create GitHub release
        if: steps.version.outputs.kind != 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          ARGS=(--title "PNNL Claude API Switch $TAG" --notes-file release-notes.md --generate-notes)
          LATEST="${{ steps.version.outputs.latest }}"
          if [ -n "$LATEST" ] && [ "$LATEST" != "$TAG" ]; then ARGS+=(--notes-start-tag "$LATEST"); fi
          # Tag pushes already have the tag; otherwise create it at this commit
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then ARGS+=(--target "$GITHUB_SHA"); fi
          if [ "${{ steps.version.outputs.kind }}" = "prerelease" ]; then
            ARGS+=(--prerelease --latest=false)
          else
            ARGS+=(--latest)
          fi
          gh release create "$TAG" "pnnl-claude-switch-$VERSION.vsix" "${ARGS[@]}"
          echo "### Released [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit released version to main
        if: steps.version.outputs.kind == 'release' && github.event_name == 'workflow_dispatch'
        continue-on-error: true   # the release already exists; this only keeps package.json in step
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release v$VERSION"
          # Pushes made with GITHUB_TOKEN don't trigger workflows, so this won't create a pre-release
          git pull --rebase origin main && git push origin HEAD:main

      - name: Prune old pre-releases
        if: steps.version.outputs.kind != 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[].tagName' > prereleases.txt
          {
            # Beyond the newest $KEEP_PRERELEASES …
            tail -n +"$((KEEP_PRERELEASES + 1))" prereleases.txt
            # … and, after a full release, the pre-releases it supersedes
            if [ "${{ steps.version.outputs.kind }}" = "release" ]; then
              grep -F "v$VERSION-pre." prereleases.txt || true
            fi
          } | sort -u | while read -r tag; do
            [ -n "$tag" ] || continue
            echo "Deleting pre-release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

      # - name: Publish to VS Code Marketplace
      #   if: steps.version.outputs.kind == 'release'
      #   run: npx vsce publish --packagePath "pnnl-claude-switch-${{ steps.version.outputs.version }}.vsix" --pat ${{ secrets.VSCE_PAT }}

      # - name: Publish to Open VSX Registry
      #   if: steps.version.outputs.kind == 'release'
      #   run: npx ovsx publish "pnnl-claude-switch-${{ steps.version.outputs.version }}.vsix" --pat ${{ secrets.OVSX_PAT }}
